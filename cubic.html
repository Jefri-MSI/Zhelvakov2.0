<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кубики</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #cube table { border-collapse: collapse; margin: 20px; }
        #cube td { width: 30px; height: 30px; border: 5px solid white; }
    </style>
</head>
<body>
<div class="my_menu">
    <script src="menu.js"></script>
</div>

<h1>Кубики</h1>
<div id="cube"></div>

<script>
    var html = "<table>";

    for (var i = 0; i < 11; i++)
    {
        html = html + "<tr>";

        for (var j = 0; j < 11; j++)
        {
            if (i + j >= 10)
            {
                html = html + "<td style='background:#000080'></td>";
            }
            else
            {
                html = html + "<td style='background:#00d2ff'></td>";
            }
        }

        html = html + "</tr>";
    }

    html = html + "</table>";
    document.getElementById("cube").innerHTML = html;
</script>
</body>
</html>
