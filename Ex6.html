<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ex6 - Степени двойки</title>
</head>
<body>
<h2>Таблица степеней двойки</h2>
<script type="text/javascript">
document.write("<table border='1' cellpadding='8'>");
document.write("<tr><th>Степень</th><th>Результат</th></tr>");
for (var i = 0; i < 6; i++) {
    document.write("<tr><td>2<sup>" + i + "</sup></td><td>" + Math.pow(2, i) + "</td></tr>");
}
document.write("</table>");
</script>
<p><a href="index.html">На главную</a></p>
</body>
</html>
