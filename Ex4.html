<!DOCTYPE html>

<body>
<h2>Задание 1. Сравнение чисел</h2>
<script type="text/javascript">
var x, y;
x = parseInt(prompt("Введите значение x:"));
y = parseInt(prompt("Введите значение y:"));
if (x == y) {
    alert("Введенные числа равны!");
}
else if (x < y) {
    alert("Максимальное число - y");
}
else {
    alert("Максимальное число - x");
}
</script>
<h2>Проверка пароля</h2>
<script type="text/javascript">
var password = "12345";
var p = prompt("Введите пароль:");
if (p == password) {
    document.write("Пароль верен!");
}
else {
    alert("Неправильно введен пароль!");
}
</script>

</body>
